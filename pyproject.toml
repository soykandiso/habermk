[project]
name = "habermk"
version = "0.1.0"
description = "Macedonian anti-clickbait micro-news bot"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "trafilatura>=2.0",
    "pyyaml>=6.0",
    "groq>=0.30",
    "google-genai>=1.20",
    "atproto>=0.0.60",
    "pillow>=10.0",
]

[project.optional-dependencies]
paid = ["anthropic>=0.70"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
habermk = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
