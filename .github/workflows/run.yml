name: run

# The bot. Every 15 minutes; the posting window (06:00–23:59 Skopje) is
# checked in the code. Switched on by the repository variable BOT_ENABLED=true.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = send drafts only, never publish"
        type: choice
        options: ["0", "1"]
        default: "0"

# Never two runs at once: they share the state file.
concurrency:
  group: habermk-state
  cancel-in-progress: false

permissions:
  contents: write   # push the state branch

jobs:
  run:
    if: vars.BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .

      - name: Check out the state branch
        run: |
          git config --global user.name "habermk-bot"
          git config --global user.email "habermk-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state:state
            git worktree add state-wt state
          else
            git worktree add --orphan -b state state-wt
          fi

      - name: Run the bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          APPROVAL_MODE: ${{ vars.APPROVAL_MODE || 'manual' }}
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || '0' }}
          STATE_FILE: state-wt/state.json
          STATE_GIT_DIR: state-wt
        run: python -m habermk.main
