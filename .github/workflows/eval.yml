name: eval

# Phase 0: run the same prompt on several models over real stories.
# Actions → eval → Run workflow. Download the "eval-results" artifact and open
# the CSV in Excel to score the Macedonian.
on:
  workflow_dispatch:
    inputs:
      stories:
        description: "How many stories"
        default: "40"
      models:
        description: "Comma-separated provider:model (empty = config.yaml list)"
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[paid]"
      - name: Evaluate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # inputs go through env, never pasted into the script (no injection)
          STORIES: ${{ inputs.stories }}
          MODELS: ${{ inputs.models }}
        run: |
          set -- --stories "$STORIES"
          if [ -n "$MODELS" ]; then set -- "$@" --models "$MODELS"; fi
          python scripts/eval_models.py "$@"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-results
          path: eval/
