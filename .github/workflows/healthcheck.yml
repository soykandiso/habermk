name: healthcheck

# Weekly: is vesti.mk still parseable, are the bot / Bluesky / Facebook
# credentials still valid? Failures are sent to your Telegram chat.
# The repo activity from this and the state branch also keeps GitHub from
# disabling scheduled workflows after 60 idle days.
on:
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    if: vars.BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python -m habermk.health
